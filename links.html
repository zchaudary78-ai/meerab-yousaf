<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="only light">
<title>Guest Links · Meerab &amp; Yousaf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Slab:ital,wght@0,400;0,600;1,400&family=Gilda+Display&display=swap">
<style>
:root{--bg:#f4f0f9;--card:#fff;--ink:#3b2f4d;--muted:#76698a;--line:#d9ccef;--lav:#8a6fb8;--plum:#4f3878;--wa:#2e8b57;color-scheme:only light}
*{box-sizing:border-box}
html,body{color-scheme:only light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Josefin Slab",Georgia,serif;font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:"Gilda Display",Georgia,serif;font-weight:400;font-size:34px;color:var(--plum);margin:0;line-height:1.1}
.sub{font-family:"Gilda Display",Georgia,serif;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--lav);margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px}
label{font-family:"Gilda Display",Georgia,serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
textarea,input{width:100%;font:inherit;color:var(--ink);background:#fbf9fe;border:1px solid var(--line);border-radius:6px;padding:12px}
textarea{min-height:170px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--lav);outline-offset:1px}
.hint{font-size:15px;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,.btn{font-family:"Gilda Display",Georgia,serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-radius:4px;border:1px solid var(--lav);
  background:var(--lav);color:#fff;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
button.ghost,.btn.ghost{background:transparent;color:var(--plum)}
.btn.wa{background:var(--wa);border-color:var(--wa)}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.count{font-size:15px;color:var(--muted)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:8px;min-width:0}
li .who{font-family:"Gilda Display",Georgia,serif;font-size:17px;letter-spacing:.04em}
li .url{font-size:12px;color:var(--muted);white-space:nowrap;overflow-x:auto;user-select:all}
li .row button,li .row .btn{padding:9px 12px;font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--plum);color:#fff;padding:9px 16px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <p class="sub">Meerab &amp; Yousaf · Nikkah</p>
    <h1>Guest links</h1>
  </div>

  <div class="panel">
    <label for="names">Guest names, one per line</label>
    <textarea id="names" placeholder="Ahmed Khan &amp; Family&#10;Sara Ali&#10;Uncle Tariq &amp; Aunty Nadia"></textarea>
    <label for="msg">Message sent with each link</label>
    <input id="msg" value="Assalam o Alaikum! You are warmly invited to the Nikkah of Meerab & Yousaf. Please open your invitation:">
    <p class="hint">Each link opens the invitation with “Specially for …” on the envelope and “Dear …” on the card. Names stay on this phone only.</p>
    <div class="row"><button id="make" type="button">Make links</button><button id="copyall" class="ghost" type="button" hidden>Copy all</button><span class="count" id="count"></span></div>
  </div>

  <ol id="list"></ol>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const BASE='https://zchaudary78-ai.github.io/meerab-yousaf/';
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
$('names').value=store.get('guestNames')||'';
const m=store.get('guestMsg'); if(m) $('msg').value=m;

const linkFor=n=>BASE+'?to='+encodeURIComponent(n).replace(/%20/g,'+');
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1600);}
async function copy(text,done){
  try{await navigator.clipboard.writeText(text);toast(done);}
  catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast(done);}catch(_){toast('Select the link and copy it');}ta.remove();}
}
function make(){
  const names=[...new Set($('names').value.split('\n').map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean))];
  store.set('guestNames',$('names').value); store.set('guestMsg',$('msg').value);
  const list=$('list'); list.innerHTML='';
  names.forEach(n=>{
    const url=linkFor(n), text=$('msg').value.trim()+'\n'+url;
    const li=document.createElement('li');
    li.innerHTML='<span class="who"></span><span class="url"></span><div class="row"><a class="btn wa" target="_blank" rel="noopener">Send on WhatsApp</a><button type="button" class="ghost c">Copy link</button><a class="btn ghost p" target="_blank" rel="noopener">Preview</a></div>';
    li.querySelector('.who').textContent=n;
    li.querySelector('.url').textContent=url;
    li.querySelector('.wa').href='https://wa.me/?text='+encodeURIComponent(text);
    li.querySelector('.p').href=url;
    li.querySelector('.c').addEventListener('click',()=>copy(text,'Copied for '+n));
    list.appendChild(li);
  });
  $('count').textContent=names.length?names.length+(names.length===1?' link':' links'):'Add at least one name';
  $('copyall').hidden=!names.length;
}
$('make').addEventListener('click',make);
$('copyall').addEventListener('click',()=>{
  const all=[...document.querySelectorAll('#list li')].map(li=>li.querySelector('.who').textContent+': '+li.querySelector('.url').textContent).join('\n');
  copy(all,'All links copied');
});
if($('names').value.trim()) make();
</script>
</body>
</html>
